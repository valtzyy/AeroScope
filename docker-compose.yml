# ==============================================================================
# Aviation Monitoring & Analytics Platform — Docker Compose
# ==============================================================================
# Orchestrasi multi-container untuk lingkungan lokal dan demo produksi:
# 1. postgres: Database relasional utama untuk data pengguna, penerbangan, dan observasi.
# 2. redis: In-memory cache ephemeral (tanpa persistensi disk yang tidak perlu).
# 3. backend: FastAPI application server (Port 8000).
# 4. frontend: Next.js application (Port 3000).

services:
  # Database PostgreSQL 16
  # Data disimpan secara persisten pada volume 'pgdata' agar tidak hilang saat container restart.
  postgres:
    image: postgres:16-alpine
    container_name: aviation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aviation_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aviation_password}
      POSTGRES_DB: ${POSTGRES_DB:-aviation_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Ephemeral Redis 7 Cache
  # Argumen '--save "" --appendonly no' mematikan persistensi disk.
  # Alasan arsitektur: Redis hanya digunakan untuk caching kueri dan rate-limiting.
  # Status permanen aplikasi sepenuhnya berada di PostgreSQL.
  redis:
    image: redis:7-alpine
    container_name: aviation_redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aviation_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      FLIGHT_PROVIDER: ${FLIGHT_PROVIDER:-mock}
      AVIATIONSTACK_API_KEY: ${AVIATIONSTACK_API_KEY:-}
      AVIATIONSTACK_BASE_URL: ${AVIATIONSTACK_BASE_URL:-http://api.aviationstack.com/v1}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aviation_user}:${POSTGRES_PASSWORD:-aviation_password}@postgres:5432/${POSTGRES_DB:-aviation_db}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev_super_secret_jwt_key_at_least_32_characters_long_for_safety}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3

  # Frontend Next.js 15
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aviation_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"

volumes:
  # Volume disk untuk database PostgreSQL saja
  pgdata:
